{% load static %}

<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{% block title %}TN-Keys{% endblock %}</title>

<link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>


<!-- NAVBAR -->
<nav class="navbar">
    <div class="navbar-container">

        <a href="/" class="logo">
            TN-Keys
        </a>

        <ul class="nav-links">
            <li>
                <a href="/">Início</a>
            </li>

            <li>
                <a href="/jogo">Jogos</a>
            </li> 

            <li>
                <a href="/sobre/">Sobre</a>
            </li>

            <li>
                <a href="/contato/">Contato</a>
            </li>
        </ul>

    </div>
</nav>


<!-- CONTEÚDO DAS PÁGINAS -->
<main>
    {% block content %}
    {% endblock %}
</main>


<!-- FOOTER -->
<footer class="footer">
    <div class="footer-container">

        <p>
            &copy; {% now "Y" %} TN-Keys. Todos os direitos reservados.
        </p>

        <div class="footer-links">
            <a href="#">Instagram</a>
            <a href="#">Discord</a>
            <a href="#">GitHub</a>
        </div>

    </div>
</footer>


</body>

</html>
